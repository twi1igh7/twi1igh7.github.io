<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026级新生反诈讲座签到</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background-color: #f0f2f5;
    color: #333;
  }
  .banner {
    background: linear-gradient(135deg, #1e5fc4 0%, #2a7de1 100%);
    color: #fff;
    padding: 22px 16px 18px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(30, 95, 196, 0.25);
  }
  .banner h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .banner p {
    margin-top: 6px;
    font-size: 13px;
    opacity: 0.85;
  }
  .container {
    max-width: 420px;
    margin: 0 auto;
    padding: 16px 14px 30px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 24px 20px 28px;
    margin-top: -8px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
  }
  .notice {
    background: #f2f7ff;
    border-left: 3px solid #2a7de1;
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 13px;
    color: #4a6a96;
    line-height: 1.6;
    margin-bottom: 22px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 14px;
    color: #333;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .form-group label span {
    color: #e34d4d;
    margin-left: 2px;
  }
  .form-group input {
    width: 100%;
    height: 46px;
    border: 1px solid #d9d9d9;
    border-radius: 6px;
    padding: 0 12px;
    font-size: 16px;
    color: #333;
    background: #fafafa;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .form-group input:focus {
    border-color: #2a7de1;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(42, 125, 225, 0.12);
  }
  .btn {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, #1e5fc4, #2a7de1);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 4px;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.2s;
  }
  .btn:active {
    opacity: 0.85;
  }
  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .error {
    display: none;
    background: #fff2f0;
    border: 1px solid #ffccc7;
    color: #cf2323;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    text-align: center;
    margin-bottom: 18px;
  }
</style>
</head>
<body>
  <div class="banner">
    <h1>2026级新生反诈讲座签到</h1>
    <p>请如实填写个人信息，完成到场签到</p>
  </div>

  <div class="container">
    <div class="card">
      <div class="notice">本次讲座已纳入新生入学安全教育环节，请各位同学于讲座开始前完成签到。</div>
      <div class="error" id="errorMsg">网络异常，请重试</div>
      <form id="checkinForm" novalidate>
        <div class="form-group">
          <label for="xuehao">学号<span>*</span></label>
          <input type="text" id="xuehao" name="xuehao" placeholder="请输入学号" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="xingming">姓名<span>*</span></label>
          <input type="text" id="xingming" name="xingming" placeholder="请输入姓名" required autocomplete="off">
        </div>
        <button type="submit" class="btn" id="submitBtn">签 到</button>
      </form>
    </div>
  </div>

<script>
  var form = document.getElementById('checkinForm');
  var errorMsg = document.getElementById('errorMsg');
  var submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var xuehao = document.getElementById('xuehao').value.trim();
    var xingming = document.getElementById('xingming').value.trim();

    if (!xuehao) {
      alert('请输入学号');
      document.getElementById('xuehao').focus();
      return;
    }
    if (!xingming) {
      alert('请输入姓名');
      document.getElementById('xingming').focus();
      return;
    }

    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = '提交中…';

    fetch('https://formsubmit.co/ajax/1397994670@qq.com', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        xuehao: xuehao,
        xingming: xingming
      })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        window.location.href = './warning/';
      })
      .catch(function () {
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = '签 到';
      });
  });
</script>
</body>
</html>
