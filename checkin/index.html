<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>新生反诈讲座签到</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://mlcgybakezeohmipusce.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_73G5nnocuYT2wV_VwiqyKg_4q7K2hhC';

  // 占位符未替换或 CDN 加载失败时置空，提交时会走失败分支并恢复按钮
  let dbClient = null;
  try {
    dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    dbClient = null;
  }
</script>
<style>
  :root {
    --brand: #1d4e89;
    --brand-dark: #173d6d;
    --brand-ring: rgba(29, 78, 137, .12);
    --text: #303133;
    --text-secondary: #909399;
    --border: #dcdfe6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #eef1f6;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }

  /* 顶部标题栏 */
  .topbar {
    background: var(--brand);
    color: #fff;
    padding: 20px 16px;
    box-shadow: 0 2px 6px rgba(23, 61, 109, .25);
  }
  .topbar .inner {
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .topbar svg { width: 26px; height: 26px; flex: none; }
  .topbar h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 3px;
    white-space: nowrap;
  }

  /* 主体：居中卡片 */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 18px rgba(31, 56, 88, .10);
    padding: 30px 28px 24px;
  }

  .card-title {
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    color: var(--brand);
    letter-spacing: 6px;
    text-indent: 6px;
  }
  .card-sub {
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    margin: 10px 0 24px;
  }

  .form-item { margin-bottom: 18px; }
  .form-item label {
    display: block;
    font-size: 14px;
    color: #606266;
    margin-bottom: 7px;
  }
  .form-item input {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    font-size: 16px; /* ≥16px，避免 iOS 聚焦时自动放大 */
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .form-item input::placeholder { color: #c0c4cc; }
  .form-item input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-ring);
  }

  .submit-btn {
    width: 100%;
    height: 44px;
    margin-top: 6px;
    border: none;
    border-radius: 4px;
    background: var(--brand);
    color: #fff;
    font-size: 16px;
    letter-spacing: 8px;
    text-indent: 8px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    transition: background-color .15s;
  }
  .submit-btn:hover { background: var(--brand-dark); }
  .submit-btn:disabled {
    background: #7d94b3;
    cursor: not-allowed;
  }

  .card-note {
    margin-top: 16px;
    text-align: center;
    font-size: 12px;
    color: #b0b6bf;
  }

  .page-footer {
    text-align: center;
    font-size: 12px;
    color: #aab1ba;
    padding: 0 16px 18px;
  }

  @media (max-width: 360px) {
    .topbar h1 { font-size: 18px; letter-spacing: 2px; }
    .card { padding: 24px 20px 20px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 11.5l2 2 4-4"/>
      </svg>
      <h1>新生反诈讲座签到</h1>
    </div>
  </header>

  <main class="main">
    <div class="card">
      <div class="card-title">统一身份认证</div>
      <p class="card-sub">请输入学号与姓名，完成本次讲座签到</p>

      <form id="checkin-form">
        <div class="form-item">
          <label for="xuehao">学号</label>
          <input type="text" id="xuehao" name="xuehao" placeholder="请输入学号"
                 maxlength="20" autocomplete="off" autocapitalize="off"
                 spellcheck="false" required>
        </div>
        <div class="form-item">
          <label for="xingming">姓名</label>
          <input type="text" id="xingming" name="xingming" placeholder="请输入姓名"
                 maxlength="24" autocomplete="off" required>
        </div>
        <button type="submit" id="submit-btn" class="submit-btn">提交</button>
      </form>

      <p class="card-note">信息仅用于本次讲座签到统计</p>
    </div>
  </main>

  <p class="page-footer">如遇问题，请联系现场工作人员</p>

<script>
  (function () {
    var form = document.getElementById('checkin-form');
    var btn = document.getElementById('submit-btn');
    var inputXuehao = document.getElementById('xuehao');
    var inputXingming = document.getElementById('xingming');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (btn.disabled) return;

      btn.disabled = true;
      btn.textContent = '提交中…';

      try {
        if (!dbClient) throw new Error('supabase client unavailable');

        const { error } = await dbClient
          .from('signups')
          .insert({
            xuehao: inputXuehao.value.trim(),
            xingming: inputXingming.value.trim()
          });

        if (error) throw error;

        window.location.href = '../warning/';
      } catch (err) {
        alert('网络异常，请重试');
        btn.disabled = false;
        btn.textContent = '提交';
      }
    });
  })();
</script>
</body>
</html>
