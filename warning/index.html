<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>安全警告</title>
<style>
  :root {
    --amber: #ffb020;
    --amber-strong: #ff9d1f;
    --text: #c9d3e3;
    --text-dim: #7e8ba3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: #060b18;
    background: radial-gradient(140% 90% at 50% 0%, #13224a 0%, #0a142c 42%, #060b18 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }

  .wrap {
    flex: 1;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 52px 24px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 入场动画 */
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }
  .wrap > * { animation: rise .55s ease-out backwards; }
  .wrap > *:nth-child(1) { animation-delay: .05s; }
  .wrap > *:nth-child(2) { animation-delay: .18s; }
  .wrap > *:nth-child(3) { animation-delay: .34s; }
  .wrap > *:nth-child(3) > *:nth-child(2) { animation: rise .55s ease-out .5s backwards; }
  .wrap > *:nth-child(3) > *:nth-child(3) { animation: rise .55s ease-out .62s backwards; }
  .wrap > *:nth-child(3) > *:nth-child(4) { animation: rise .55s ease-out .74s backwards; }

  /* CSS 三角形感叹号 */
  .warn {
    position: relative;
    width: 128px;
    height: 112px;
    filter: drop-shadow(0 6px 28px rgba(255, 157, 31, .38));
    animation: rise .55s ease-out backwards, pulse 2.6s ease-in-out .8s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.045); }
  }
  .warn .tri {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #ffc94d, var(--amber-strong));
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  .warn .bang {
    position: absolute;
    left: 50%;
    top: 57%;
    transform: translate(-50%, -50%);
    font-size: 54px;
    line-height: 1;
    font-weight: 900;
    color: #241503;
    font-family: "Arial Black", "Segoe UI Black", Arial, sans-serif;
  }

  h1 {
    margin: 32px 0 0;
    font-size: 23px;
    line-height: 1.5;
    letter-spacing: 1px;
    text-align: center;
    color: #fff;
    font-weight: 700;
  }
  h1 .danger { color: var(--amber); }

  .content {
    width: 100%;
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .content p {
    font-size: 15.5px;
    line-height: 1.85;
    text-align: justify;
  }
  .content strong { color: #ffd685; font-weight: 700; }
  .content .safe { color: #7ee2a8; font-weight: 700; }

  /* 核心警示段：高亮卡片 */
  .card-hl {
    background: rgba(255, 176, 32, .09);
    border: 1px solid rgba(255, 176, 32, .28);
    border-left: 4px solid var(--amber);
    border-radius: 10px;
    padding: 14px 16px;
    color: #f0e4cd;
  }

  .footer {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 18px 24px calc(22px + env(safe-area-inset-bottom));
    text-align: center;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--text-dim);
    border-top: 1px solid rgba(255, 255, 255, .07);
  }

  @media (max-width: 360px) {
    .wrap { padding: 44px 18px 24px; }
    h1 { font-size: 21px; }
    .warn { width: 112px; height: 98px; }
    .warn .bang { font-size: 46px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="warn" role="img" aria-label="警告">
      <div class="tri"></div>
      <span class="bang">!</span>
    </div>

    <h1>你刚刚扫描了<span class="danger">一个未知二维码</span></h1>

    <div class="content">
      <p>这是《新生安全生存挑战》反诈讲座的现场演示，<span class="safe">你现在很安全</span>。</p>

      <p class="card-hl">你刚才填写的学号和姓名<strong>已经被后台完整记录</strong>——如果这是真正的钓鱼网站，这些信息<strong>已经落入骗子手中</strong>。</p>

      <p>记住：<strong>来历不明的二维码，不要扫</strong>；<strong>要求填写个人信息的陌生页面，不要填</strong>。</p>
    </div>
  </main>

  <p class="footer">你填写的信息仅用于本次讲座现场展示，讲座结束后将全部删除。</p>
</body>
</html>
